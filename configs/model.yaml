# NL research defaults. No operating point has measured NL precision.
model:
  name: xview3_circlenet_ensemble
  type: xview3
  version: "1.0"
  xview3_sha256: c21d6b4204e2803b56014c9780d8d62190ed81d9c2ec56d0cbf437b439307d38
  yolo_sha256: 8c3b45950ec1c1d954c4a7a901744d8024b59be75684b92064da0a5a9c979297
  classes:
    4: unknown
sensor:
  platform: Sentinel-1
  product_type: GRD
  polarizations: [VV, VH]
tiling:
  tile_size: 640  # experimental YOLO / synthetic smoke detector
  overlap: 128
  use_windowed_read: true
  xview3_overlap: 128  # fixed 2048px tiles; adapted, not upstream stitching
inference:
  detector: xview3
  device: cuda  # CPU fallback is supported but much slower
  conf_threshold: 0.35  # experimental YOLO only
  iou_threshold: 0.45
  crs: EPSG:4326
  xview3_threshold: 0.15  # provisional objectness, not vessel probability
landmask:
  enabled: true
  source: osm
  coastal_buffer_m: 300  # conservative review band, not a measured accuracy claim
  cache_dir: null
infrastructure:
  enabled: true
  exclusion_radius_m: 500  # proximity review only; movable FPSOs not masked
