x-tritoneye-base: &tritoneye-base
  build: .
  image: tritoneye:latest
  volumes:
    - ./data:/app/data
    - ./missions:/app/missions
    - ./reports:/app/reports
    - ./models:/app/models
    - ./mlruns:/app/mlruns
    - ./state:/app/state
  env_file:
    - path: .env
      required: false
  environment:
    PYTHONPATH: /app
    MLFLOW_TRACKING_URI: sqlite:////app/state/mlflow.db

services:
  pipeline:
    <<: *tritoneye-base
    profiles: ["stage"]
    command: python -m agents.pipeline
  ingest:
    <<: *tritoneye-base
    profiles: ["stage"]
    command: python -m agents.ingest.ingest_agent
  inference:
    <<: *tritoneye-base
    profiles: ["stage"]
    command: python -m agents.inference.inference_agent
  correlation:
    <<: *tritoneye-base
    profiles: ["stage"]
    command: python -m agents.correlation.correlation_agent
  evaluate:
    <<: *tritoneye-base
    profiles: ["stage"]
    command: python -m agents.evaluate.evaluate_agent
  report:
    <<: *tritoneye-base
    profiles: ["stage"]
    command: python -m agents.report.report_agent
  ais-recorder:
    <<: *tritoneye-base
    # NL subscription envelope; live observations are not complete ground truth.
    command: python -m agents.ais_recorder
    restart: unless-stopped
  tests:
    <<: *tritoneye-base
    profiles: ["ci"]
    environment:
      TRITONEYE_TRACKING: "off"
    command: pytest tests/ -q -m "not slow"
