# Every agent is a one-shot stage reading a JSON payload on stdin and writing
# one on stdout, so these are `docker compose run` targets rather than services
# to bring up. They sit behind profiles for that reason: a bare
# `docker compose up` would otherwise launch all of them at once, each blocking
# on an empty stdin.
#
#   docker compose run --rm pipeline        full five-stage run
#   docker compose run --rm ingest          a single stage
#   docker compose up ais-recorder          the one genuinely long-running service
#   docker compose run --rm tests           unit tests inside the image

x-tritoneye-base: &tritoneye-base
  build:
    context: .
    dockerfile: Dockerfile
  image: tritoneye:latest
  volumes:
    - ./data:/app/data
    - ./missions:/app/missions
    - ./reports:/app/reports
    - ./models:/app/models
    - ./mlruns:/app/mlruns
    - ./mlflow.db:/app/mlflow.db
    - ./.env:/app/.env
  environment:
    - PYTHONPATH=/app

services:
  # ---------------------------------------------------------------- stages
  ingest:
    <<: *tritoneye-base
    profiles: ["stage"]
    command: python agents/ingest/ingest_agent.py

  inference:
    <<: *tritoneye-base
    profiles: ["stage"]
    command: python agents/inference/inference_agent.py

  correlation:
    <<: *tritoneye-base
    profiles: ["stage"]
    command: python agents/correlation/correlation_agent.py

  report:
    <<: *tritoneye-base
    profiles: ["stage"]
    command: python agents/report/report_agent.py

  # Scores detections against AIS-derived ground truth and logs operational
  # metrics to the mission's MLflow run.
  evaluate:
    <<: *tritoneye-base
    profiles: ["stage"]
    command: python agents/evaluate/evaluate_agent.py

  # ---------------------------------------------------------------- pipeline
  # `set -o pipefail` is deliberate: /bin/sh in python:*-slim is dash, whose
  # pipelines report only the last command's status, so an ingest failure would
  # otherwise surface as a confusing JSON parse error downstream and still exit 0.
  pipeline:
    <<: *tritoneye-base
    profiles: ["stage"]
    entrypoint: /bin/bash
    command: >
      -c "set -o pipefail;
      python agents/ingest/ingest_agent.py
      | python agents/inference/inference_agent.py
      | python agents/correlation/correlation_agent.py
      | python agents/report/report_agent.py
      | python agents/evaluate/evaluate_agent.py"

  # ---------------------------------------------------------------- services
  # The only service meant to stay up, and the project's ONLY route to ground
  # truth: no historical AIS archive covers Newfoundland and Labrador, so recall
  # can only ever be measured for periods this was running. It records from
  # whenever it starts onward and cannot backfill imagery already on disk, so
  # every hour it is down is permanently unscorable.
  #
  # `restart: unless-stopped` is the point of running it here rather than by
  # hand -- a shell-backgrounded recorder dies with its session, and the archive
  # gap is not noticed until an acquisition turns out to be unscorable.
  #
  # No --aoi: the default is the nl_shelf recording envelope, which contains
  # every imaging AOI. Do not narrow it to one imaging AOI.
  # Requires AISSTREAM_API_KEY in .env.
  ais-recorder:
    <<: *tritoneye-base
    command: python agents/ais_recorder.py
    restart: unless-stopped

  # ---------------------------------------------------------------- checks
  tests:
    <<: *tritoneye-base
    profiles: ["ci"]
    command: pytest tests/ -q
