[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tritoneye"
version = "0.1.0"
description = "Autonomous Geospatial Target Correlation and Dark Vessel Detection Pipeline"
readme = "readme.md"
requires-python = ">=3.12"
authors = [
    { name = "TritonEye Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.3.0",
    "ultralytics>=8.2.0",
    "rasterio>=1.3.10",
    "geopandas>=0.14.3",
    "shapely>=2.0.4",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "dvc[s3]>=3.51.0",
    "mlflow>=2.13.0",
    "psycopg2-binary>=2.9.9",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "boto3>=1.34.120",
    "pyproj>=3.6.1",
    "rtree>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "black>=24.4.2",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "types-requests>=2.31.0.20240406",
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
