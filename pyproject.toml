[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tritoneye"
version = "0.2.0"
description = "Newfoundland and Labrador SAR/AIS maritime target research pipeline"
readme = "readme.md"
requires-python = ">=3.12"
authors = [
    { name = "TritonEye Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch==2.6.0",
    "ultralytics==8.4.90",
    "rasterio==1.5.0",
    "geopandas==1.1.4",
    "shapely==2.1.2",
    "python-dotenv==1.1.1",
    "requests==2.34.2",
    "mlflow==3.14.0",
    "numpy==2.2.6",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "PyYAML==6.0.2",
    "huggingface-hub==0.36.2",
    "pyproj==3.7.2",
    "rtree==1.4.1",
    "websockets==15.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "black==26.5.1",
    "ruff==0.16.4",
    "mypy==2.3.1",
    "types-requests==2.33.0.20260518",
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_configs = true

# Keep strict checking on all explicit project files without recursively
# analyzing implementation internals of the heavyweight ML dependencies.
[[tool.mypy.overrides]]
module = ["torch.*", "ultralytics.*", "mlflow.*", "huggingface_hub.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
markers = [
    "slow: loads the 1.3 GB xView3 ensemble; deselect with -m 'not slow'",
]

[tool.setuptools.packages.find]
include = ["agents*"]
